<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <meta property="og:title" content="Your Name (Bio Link)" />
  <meta property="og:description" content="Customizable bio link page. Edit the CONFIG block inside the file to personalize." />
  <meta property="og:image" content="https://i.pravatar.cc/512?img=68" />
  <meta name="theme-color" content="#000000" />

  <title>Bio Link Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --surface: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.50);
      --radius: 20px;
      --avatar-size: 72px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Geist', system-ui, sans-serif;
      overflow: hidden;
    }

    .bg-beams {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-beams svg {
      position: absolute;
      width: 100%;
      height: 100%;
    }



    .scene {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 16px;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      gap: 0;
      animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .view-counter {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.2s ease;
      user-select: none;
      z-index: 10;
      animation: fadeIn 0.8s ease forwards;
      animation-delay: 0.3s;
      opacity: 0;
    }

    .view-counter:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .view-counter svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .avatar {
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
      display: block;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.06);
    }

    .username {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.4px;
      line-height: 1.15;
      color: var(--text);
    }

    .bio {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 300;
      line-height: 1.65;
      color: rgba(255, 255, 255, 0.85);
      max-width: 92%;
    }

    .socials {
      display: flex;
      flex-direction: row;
      gap: 16px;
      margin-top: 18px;
      align-items: center;
    }

    .social-link {
      color: var(--muted);
      display: flex;
      align-items: center;
      text-decoration: none;
      transition: color 0.18s;
    }

    .social-link:hover {
      color: var(--text);
    }

    .social-link svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      display: block;
    }

    .time {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .time svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    #click-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.5s ease;
    }

    #click-overlay span {
      font-size: 32px;
      font-weight: 600;
      color: var(--muted);
      transition: color 0.3s;
    }

    #click-overlay:hover span {
      color: var(--text);
    }

    .music-controller {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.1s;
    }

    .music-info {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .music-info span {
      color: var(--text);
      font-weight: 500;
    }

    .music-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .music-actions button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: color 0.2s;
    }

    .music-actions button:hover {
      color: var(--text);
    }

    .music-actions svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .volume-container {
      display: flex;
      align-items: center;
      position: relative;
    }

    .volume-slider {
      width: 0;
      opacity: 0;
      visibility: hidden;
      transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease, margin 0.3s ease;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(to right, var(--text) var(--progress, 100%), rgba(255, 255, 255, 0.2) var(--progress, 100%));
      outline: none;
    }

    .volume-container:hover .volume-slider,
    .volume-slider:focus {
      width: 60px;
      opacity: 1;
      visibility: visible;
      margin-left: 8px;
    }

    .volume-slider::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      background: transparent;
      border-radius: 2px;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 10px;
      width: 10px;
      border-radius: 50%;
      background: var(--text);
      cursor: pointer;
      margin-top: -3px;
    }

    .advanced-player {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.1s;
    }

    .advanced-info {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
    }
    
    .advanced-time {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
    }

    .timeline-container {
      width: 100%;
    }

    .timeline-slider {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(to right, var(--text) var(--progress, 0%), rgba(255, 255, 255, 0.2) var(--progress, 0%));
      outline: none;
      cursor: pointer;
    }

    .timeline-slider::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      background: transparent;
      border-radius: 2px;
    }

    .timeline-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 12px;
      width: 12px;
      border-radius: 50%;
      background: var(--text);
      margin-top: -4px;
    }

    .advanced-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      width: 100%;
    }

    .advanced-controls button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: color 0.2s, transform 0.1s;
    }

    .advanced-controls button:hover {
      color: var(--text);
    }
    
    .advanced-controls button:active {
      transform: scale(0.95);
    }

    .advanced-controls .play-btn svg {
      width: 32px;
      height: 32px;
    }
    
    .advanced-controls svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
  </style>
</head>

<body>

  <div class="bg-beams">

    (function render() {
      if (CONFIG.enableStaggeredEntrance) {
        const style = document.createElement('style');
        style.textContent = `
          #card > *:not(.view-counter) { opacity: 0; animation: staggerFade 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
          @keyframes staggerFade { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
          #card > *:nth-child(1) { animation-delay: 0.1s; }
          #card > *:nth-child(2) { animation-delay: 0.2s; }
          #card > *:nth-child(3) { animation-delay: 0.3s; }
          #card > *:nth-child(4) { animation-delay: 0.4s; }
          #card > *:nth-child(5) { animation-delay: 0.5s; }
          #card > *:nth-child(6) { animation-delay: 0.6s; }
        `;
        document.head.appendChild(style);
      }

        if (CONFIG.enableAudioVisualizer) {
          audio.crossOrigin = "anonymous";
          let audioCtx, analyser, dataArray, canvas, ctx;
          audio.addEventListener('play', () => {
            if (!audioCtx) {
              const AudioContext = window.AudioContext || window.webkitAudioContext;
              audioCtx = new AudioContext();
              analyser = audioCtx.createAnalyser();
              const source = audioCtx.createMediaElementSource(audio);
              source.connect(analyser);
              analyser.connect(audioCtx.destination);
              analyser.fftSize = 128;
              dataArray = new Uint8Array(analyser.frequencyBinCount);
              
              canvas = document.createElement('canvas');
              canvas.style.position = 'fixed';
              canvas.style.bottom = '0';
              canvas.style.left = '0';
              canvas.style.width = '100%';
              canvas.style.height = '20%';
              canvas.style.pointerEvents = 'none';
              canvas.style.zIndex = '0';
              canvas.style.opacity = '0.3';
              document.body.appendChild(canvas);
              ctx = canvas.getContext('2d');
              
              function drawVisualizer() {
                requestAnimationFrame(drawVisualizer);
                if(!audio.paused) analyser.getByteFrequencyData(dataArray);
                else {
                  for(let i=0; i<dataArray.length; i++) dataArray[i] = Math.max(0, dataArray[i] - 5);
                }
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight * 0.2;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const barWidth = (canvas.width / analyser.frequencyBinCount) * 2;
                let x = 0;
                for(let i = 0; i < analyser.frequencyBinCount; i++) {
                  const barHeight = (dataArray[i] / 255) * canvas.height;
                  ctx.fillStyle = `rgba(255, 255, 255, ${dataArray[i]/255})`;
                  ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                  x += barWidth + 1;
                }
              }
              drawVisualizer();
            }

            left: 0;
            width: 8px;
            height: 8px;
            background: #ffffff;

            pointer-events: none;

            transition: width 0.2s, height 0.2s;

        document.addEventListener('mouseover', (e) => {
          if (e.target.closest('a, button, input, #click-overlay')) {
            cursor.classList.add('hover');
          }
        });
        document.addEventListener('mouseout', (e) => {
          if (e.target.closest('a, button, input, #click-overlay')) {
            cursor.classList.remove('hover');
          }
        });
      }

      if (CONFIG.showGithubBadge) {
        const gh = document.createElement('a');
        gh.href = 'https://github.com/isadamii/simple-bio-link';
        gh.target = '_blank';
        gh.rel = 'noopener noreferrer';
        gh.title = 'View on GitHub';
        gh.innerHTML = `<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>`;
        gh.style.position = 'fixed';
        gh.style.bottom = '20px';
        gh.style.right = '20px';
        gh.style.color = 'var(--muted)';
        gh.style.transition = 'color 0.2s, transform 0.2s, opacity 0.2s';
        gh.style.zIndex = '9999';
        gh.style.opacity = '0.4';
        gh.addEventListener('mouseover', () => {
          gh.style.color = 'var(--text)';
          gh.style.opacity = '1';
          gh.style.transform = 'scale(1.1)';
        });
        gh.addEventListener('mouseout', () => {
          gh.style.color = 'var(--muted)';
          gh.style.opacity = '0.4';
          gh.style.transform = 'scale(1)';
        });
        document.body.appendChild(gh);
      }

    })();

    (function buildBeams() {
      const container = document.querySelector('.bg-beams');

      if (CONFIG.background === "custom") {
        container.innerHTML = '';
        if (CONFIG.backgroundUrl && CONFIG.backgroundUrl.trim() !== '') {
          container.style.backgroundImage = `url(${CONFIG.backgroundUrl})`;
          container.style.backgroundSize = 'cover';
          container.style.backgroundPosition = 'center';
          container.style.backgroundRepeat = 'no-repeat';
        } else {
          container.style.background = '#000000';
        }
        return;
      }

      if (CONFIG.background === "static") {
        container.innerHTML = `<svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="rg" cx="50%" cy="20%" r="60%">
          <stop offset="0%" stop-color="#303030" stop-opacity="0.4" />
          <stop offset="60%" stop-color="#000000" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
          <stop offset="30%" stop-color="#ffffff" stop-opacity="0.25" />
          <stop offset="65%" stop-color="#ffffff" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
      </defs>
      <rect width="1000" height="600" fill="url(#rg)" />
      <g stroke="url(#beam)" stroke-width="0.5" stroke-opacity="0.06">
        <line x1="-200" y1="-100" x2="600" y2="700" />
        <line x1="-180" y1="-100" x2="620" y2="700" />
        <line x1="-160" y1="-100" x2="640" y2="700" />
        <line x1="-140" y1="-100" x2="660" y2="700" />
        <line x1="-120" y1="-100" x2="680" y2="700" />
        <line x1="-100" y1="-100" x2="700" y2="700" />
        <line x1="-80" y1="-100" x2="720" y2="700" />
        <line x1="-60" y1="-100" x2="740" y2="700" />
        <line x1="-40" y1="-100" x2="760" y2="700" />
        <line x1="-20" y1="-100" x2="780" y2="700" />
        <line x1="0" y1="-100" x2="800" y2="700" />
        <line x1="20" y1="-100" x2="820" y2="700" />
        <line x1="40" y1="-100" x2="840" y2="700" />
        <line x1="60" y1="-100" x2="860" y2="700" />
        <line x1="80" y1="-100" x2="880" y2="700" />
        <line x1="100" y1="-100" x2="900" y2="700" />
        <line x1="120" y1="-100" x2="920" y2="700" />
        <line x1="140" y1="-100" x2="940" y2="700" />
        <line x1="160" y1="-100" x2="960" y2="700" />
        <line x1="180" y1="-100" x2="980" y2="700" />
        <line x1="200" y1="-100" x2="1000" y2="700" />
        <line x1="220" y1="-100" x2="1020" y2="700" />
        <line x1="240" y1="-100" x2="1040" y2="700" />
        <line x1="260" y1="-100" x2="1060" y2="700" />
        <line x1="280" y1="-100" x2="1080" y2="700" />
        <line x1="300" y1="-100" x2="1100" y2="700" />
        <line x1="320" y1="-100" x2="1120" y2="700" />
        <line x1="340" y1="-100" x2="1140" y2="700" />
        <line x1="360" y1="-100" x2="1160" y2="700" />
        <line x1="380" y1="-100" x2="1180" y2="700" />
        <line x1="400" y1="-100" x2="1200" y2="700" />
      </g>
      <g stroke-width="0.5" stroke-opacity="0.3">
        <line x1="-180" y1="-100" x2="620" y2="700" stroke="url(#beam)" />
        <line x1="-100" y1="-100" x2="700" y2="700" stroke="url(#beam)" />
        <line x1="0" y1="-100" x2="800" y2="700" stroke="url(#beam)" />
        <line x1="100" y1="-100" x2="900" y2="700" stroke="url(#beam)" />
      </g>
    </svg>`;
        return;
      }

      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.getElementById('beams-svg');
      const defs = svg.querySelector('defs');

      function beamPath(i) {
        const ox = 7 * i, oy = -8 * i;
        return [
          `M${-380 + ox} ${-189 + oy}`,
          `C${-380 + ox} ${-189 + oy} ${-312 + ox} ${216 + oy} ${152 + ox} ${343 + oy}`,
          `C${616 + ox} ${470 + oy} ${684 + ox} ${875 + oy} ${684 + ox} ${875 + oy}`
        ].join('');
      }

      const bgGroup = document.createElementNS(NS, 'g');
      bgGroup.setAttribute('stroke', 'url(#beam-rg)');
      bgGroup.setAttribute('stroke-opacity', '0.08');
      bgGroup.setAttribute('stroke-width', '0.5');
      bgGroup.setAttribute('fill', 'none');
      for (let i = 0; i < 60; i++) {
        const p = document.createElementNS(NS, 'path');
        p.setAttribute('d', beamPath(i));
        bgGroup.appendChild(p);
      }
      svg.appendChild(bgGroup);

      const ACCENT_COUNT = 24;

      const style = document.createElement('style');
      style.textContent = `
        @keyframes beamTravel {
          0% { stroke-dashoffset: var(--beam-start); }
          100% { stroke-dashoffset: var(--beam-end); }
        }
      `;
      document.head.appendChild(style);

      for (let i = 0; i < ACCENT_COUNT; i++) {
        const lg = document.createElementNS(NS, 'linearGradient');
        const lgId = `beam-lg-${i}`;
        lg.setAttribute('id', lgId);
        lg.setAttribute('x1', '0%'); lg.setAttribute('y1', '0%');
        lg.setAttribute('x2', '100%'); lg.setAttribute('y2', '100%');
        [
          [0, '#f8f8f8', 0],
          [0.25, '#ffffff', 1],
          [0.65, '#ffffff', 1],
          [1, '#f8f8f8', 0]
        ].forEach(([offset, color, opacity]) => {
          const stop = document.createElementNS(NS, 'stop');
          stop.setAttribute('offset', offset);
          stop.setAttribute('stop-color', color);
          if (opacity < 1) stop.setAttribute('stop-opacity', opacity);
          lg.appendChild(stop);
        });
        defs.appendChild(lg);

        const beamIndex = Math.floor(Math.random() * 60);
        const p = document.createElementNS(NS, 'path');
        p.setAttribute('d', beamPath(beamIndex));
        p.setAttribute('stroke', `url(#${lgId})`);

        const opacity = (0.15 + Math.random() * 0.25).toFixed(2);
        const width = (0.4 + Math.random() * 0.4).toFixed(2);
        p.setAttribute('stroke-opacity', opacity);
        p.setAttribute('stroke-width', width);
        p.setAttribute('fill', 'none');

        svg.appendChild(p);

        const len = p.getTotalLength();
        const segLen = len * (0.1 + Math.random() * 0.15);

        p.setAttribute('stroke-dasharray', `${segLen} ${len + 50}`);

        p.style.setProperty('--beam-start', `${segLen}`);
        p.style.setProperty('--beam-end', `-${len}`);

        const duration = 5 + Math.random() * 8;
        const delay = -(Math.random() * 15);

        p.style.animation = `beamTravel ${duration}s linear ${delay}s infinite`;
      }
    })();
  </script>
</body>
